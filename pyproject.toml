[build-system]
requires = ["setuptools>=75,<76", "wheel>=0.44,<0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "watch-lsm"
version = "0.2.0"
description = "Portable PPG/ACC foundation model experiments and data tooling"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.5.1",
    "numpy>=1.26,<2",
    "scipy>=1.13,<1.15",
    "pandas>=2.2,<2.3",
    "h5py>=3.11,<3.13",
    "PyYAML>=6.0,<7",
    "scikit-learn>=1.5,<1.6",
    "matplotlib>=3.9,<3.10",
    "wfdb>=4.1,<4.2",
    "mat73>=0.65,<0.66",
    "gdown>=5.2,<6",
    "tqdm>=4.66,<5",
    "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
data = ["vitaldb>=1.4,<2", "openpyxl>=3.1,<4"]

[tool.setuptools.packages.find]
include = ["watch_lsm*"]
namespaces = true

[tool.setuptools.package-data]
watch_lsm = ["configs/*.yaml"]
